<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #FFFFFF;
        }

        #linear1 {
            width: 100%;
            height: 100%;
            min-height: 100vh;

            background: #FFFFFF;

            padding: 40px 60px;

            display: flex;
            flex-direction: column;
        }

        #titulo {
            width: 100%;

            margin: 0;

            text-align: center;

            font-size: 34px;
            font-weight: bold;

            color: #E53935;
        }

        .campo {
            width: calc(100% - 80px);

            margin-left: 40px;
            margin-right: 40px;

            border: 2px solid #E0E0E0;
            border-radius: 20px;

            background: #F5F5F5;

            padding: 38px 32px;

            font-size: 16px;

            outline: none;
        }

        #email {
            margin-top: 40px;
            margin-bottom: 32px;
        }

        #senha {
            margin-top: 0;
            margin-bottom: 48px;
        }

        .campo:focus {
            border-color: #E53935;
        }

        #espacador {
            flex: 1;
        }

        #cadastrar {
            width: calc(100% - 120px);
            height: 130px;

            margin-left: 60px;
            margin-right: 60px;
            margin-bottom: 40px;

            border: none;
            border-radius: 65px;

            background: #E53935;
            color: #FFFFFF;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        #cadastrar:active {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div id="linear1">

    <h1 id="titulo">Criar Conta</h1>

    <input
        id="email"
        class="campo"
        type="email"
        placeholder="Digite seu e-mail"
    >

    <input
        id="senha"
        class="campo"
        type="password"
        placeholder="Crie uma senha"
    >

    <div id="espacador"></div>

    <button id="cadastrar">
        CADASTRAR
    </button>

</div>

</body>
</html>
